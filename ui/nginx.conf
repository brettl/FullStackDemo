server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The browser talks only to nginx. API calls are forwarded to the "api" container on the Docker network.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
  }

  # Single-page app: any other path serves index.html and React Router takes over.
  location / {
    try_files $uri /index.html;
  }
}
